<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1360">
    <!-- 브라우저 뷰포트 너비를 1360px로 고정하여 페이지를 그리도록 설정 -->

    <!-- favicon -->
    <link rel="shortcut icon" href="./images/favicon.ico" type="image/x-icon">
    <!-- webfont 연결-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Buda:wght@300&family=Noto+Sans+KR:wght@100..900&display=swap"
        rel="stylesheet">

        
    <!-- Link Swiper's CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.css" />

    <!-- css 연결-->
    <link rel="stylesheet" href="css/sub.css">
</head>

<body>
    <div id="wrap">
        <div id="header" class="bg1">
            <div class="header_container">
                <ul class="gnb">
                    <li><a href="./brandstoy.html">Brandstory</a></li>
                    <li><a href="./index.html#collection">Collection</a></li>
                    <li><a href="./sub.html">shop</a></li>
                </ul>

                <h1 class="logo"><a href="./index.html"><img src="./images/logo.png" alt="logo"></a></h1>

                <ul class="util">
                    <li><a href="#">Login</a></li>
                    <li><a href="#">Wish</a></li>
                </ul>
            </div>
        </div>

        <div class="product-container">
            <!-- 왼쪽: 3장 슬라이드 메인 이미지 영역 (800 x 935) -->

            <div class="sticky">

                <!-- Swiper -->
                <div class="swiper mySwiper">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide"><img src="./images/sub/main01.jpg" alt="main"></div>
                        <div class="swiper-slide"><img src="./images/sub/main02.jpeg" alt="main"></div>
                        <div class="swiper-slide"><img src="./images/sub/main03..jpg" alt="main"></div>


                    </div>


                    <div class="swiper-button-next"></div>
                    <div class="swiper-button-prev"></div>
                    <div class="autoplay-progress">
                        <svg viewBox="0 0 48 48">
                            <circle cx="24" cy="24" r="20"></circle>
                        </svg>
                        <span></span>
                    </div>


                </div>

                <div class="detail_img">

                    <img src="./images/sub/Layer_1.png" alt="detail">
                    <img id="detail01" src="./images/sub/Layer_1_1.png" alt="detail">
                    <img src="./images/sub/Layer_2.png" alt="detail">
                    <img src="./images/sub/Layer_3.png" alt="detail">
                    <img src="./images/sub/Layer_4.png" alt="detail">
                    <img src="./images/sub/Layer_5.png" alt="detail">
                    <img id="detail02" src="./images/sub/Layer_6.png" alt="detail">
                    <img id="detail03" src="./images/sub/Layer_7.png" alt="detail">


                </div>
            </div>









            <div class="product-info-sticky">
                <div class="product-info-inner">
                    <h2 class="product-title">캐시미어 브랜드 오버 숄더 트렌치 코트</h2>

                    <div class="price-box">
                        <span class="original-price">181,000</span>
                    </div>

                    <div class="color-options">
                        <span class="color-chip brown"></span>
                        <span class="color-chip  active"></span>
                    </div>

                    <div class="total-price-row">
                        <span>총 상품 금액</span>
                        <span class="total-price">0원 (0개)</span>
                    </div>

                    <div class="action-buttons">
                        <button class="btn btn-cart">장바구니</button>
                        <button class="btn btn-buy">구매하기</button>
                    </div>

                    <ul class="accordion-menu">
                        <li>><a href="#detail01"> 소재</a></li>
                        <li><a href="#detail02">> 사이즈</a></li>
                        <li><a href="#detail03">> 세탁방법</a></li>
                    </ul>
                </div>


            </div>


        </div>









        <!-- Swiper JS -->
        <script src="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.js"></script>

        <script src="./js/jquery-4.0.0.min.js"></script>

        <script src="js/sub.js"></script>
    </div>

</html>
